# Radha swing engine — configuration. Every value shown is the built-in default.
# Long-only equity-delivery (CNC) swing trading on NSE via Zerodha Kite Connect.

# "paper" simulates orders against live Kite prices. Use "live" only after the
# backtest and several weeks of paper trading look right to you.
mode: paper

kite:
  api_key: ""        # or enter it in the control panel (or env KITE_API_KEY)
  api_secret: ""     # or enter it in the control panel (or env KITE_API_SECRET)

network:
  # REQUIRED in live mode: the static IPv4 registered under "IP Whitelist" on
  # developers.kite.trade. Order calls dial out from this address.
  bind_ip: ""
  request_timeout: 10s

paths:
  universe_file: universe.csv   # the stocks the scanner may trade (edit in the control panel)
  data_dir: data                # login token, candle cache, portfolio state
  journal_dir: journal          # closed trades
  log_file: logs/engine.log

session:              # IST
  prepare_at:  "08:45:00"   # login check, reconcile with Kite holdings
  market_open: "09:15:00"
  morning_run: "09:20:00"   # gap-through-stop checks, planned exits, new entries
  market_close: "15:30:00"
  evening_run: "15:50:00"   # today's daily candle is final: move stops, scan for tomorrow

strategy:             # daily candles
  # ── Entry ────────────────────────────────────────────────────────────────
  setups: ema_cross              # ema_cross | breakout | pullback | both (= breakout + pullback)
  ema_cross_fast: 10             # ema_cross: EMA10 crosses above EMA20…
  ema_cross_slow: 20
  supertrend_period: 10          # …while Supertrend(10, 3) is green (TradingView's default)
  supertrend_mult: 3
  cross_trend_filter: false      # true: also require close > rising EMA50 (5-yr study: worse in 2024–26)
  cross_source: close            # close | ha — EMA cross and Supertrend on real or Heikin-Ashi candles (ha: mixed by half)
  regime_mode: strict            # strict: NIFTY > 20 EMA > 50 EMA and the 50 EMA rising (5-yr study: +28% vs +15% for basic)
  entry_mode: cross              # cross: only on the day the EMA cross turns · trend: also stocks already in that uptrend · both: fresh crosses first
  trend_max_days: 15             # trend/both: the cross is at most 15 sessions old…
  trend_max_ext_pct: 8           # …and the close at most 8% above EMA20 (not stretched)
  # Research tags — why a stock came up in the scan, from its own price and volume:
  #   RESULTS (gap/jump on heavy volume in the last 10 days) · TURNAROUND (fell ≥30%, back above its 200-day average)
  #   NEW_HIGH (within 3% of its 52-week high) · MOMENTUM (established uptrend, beating NIFTY) · NONE
  research_allow: all            # all | only these tags, e.g. RESULTS,NEW_HIGH
  research_rank: rs              # rs: relative strength · research: stronger tag first, then relative strength
  ema_fast: 20                   # used by breakout/pullback and the trend filter
  ema_slow: 50
  atr_period: 14
  volume_avg_period: 20
  breakout_lookback: 20          # breakout: close above the prior 20-day high…
  breakout_volume_ratio: 1.5     # …on 1.5× average volume
  pullback_lookback: 3           # pullback: low touched the 20 EMA within the last 3 days…
  pullback_tolerance_pct: 1.0
  pullback_volume_ratio: 1.0     # …then closed above yesterday's high on ≥ average volume
  slope_lookback: 5              # the 50 EMA must be rising
  min_price: 50
  min_turnover_cr: 10            # average daily turnover ≥ ₹10 crore (liquidity)
  max_gap_up_pct: 2.0            # skip an entry that opens > 2% above the signal close
  rs_lookback: 60                # rank candidates by 60-day return vs the index
  cooldown_bars: 5               # days to wait before re-entering a stock after an exit
  # ── Protective stop (a GTT at Zerodha, works even if this PC is off) ─────
  stop_mode: atr                 # atr: entry − stop_atr_mult × ATR · supertrend: green Supertrend line · swing_low
  stop_atr_mult: 3.0
  swing_low_bars: 10             # stop_mode swing_low: just below the lowest low of the last 10 days
  min_stop_pct: 3                # stop kept 3%–8% below entry
  max_stop_pct: 8
  breakeven_at_r: 1.5            # once a close reaches +1.5R the stop moves to entry + charges — a winner can't turn into a loss
  trail_mode: off                # off | atr | supertrend — 5-yr study: every trail cut winners short (the EMA cross already trails)
  trail_start_r: 2               # start trailing at +2R (if trail_mode is on)
  trail_atr_mult: 3.0            # trail_mode atr: highest close − 3 × ATR
  target_r: 0                    # profit target at +N R (0 = off) — BACKTEST ONLY; results were unstable (4R/5R/6R/8R jumped around)
  partial_pct: 100               # % sold at the target; below 100 books part and moves the rest to breakeven
  fixed_stop: true               # true: legacy ratchet below is off
  breakeven_r: 1.0               # legacy ratchet (fixed_stop false): +1R → breakeven…
  lock_r: 2.0                    # …+2R → entry + 1R, then trail_atr_mult trailing
  # ── Exits ────────────────────────────────────────────────────────────────
  exit_on_ema_cross: true        # EMA10 closes below EMA20 → sell at the next morning run
  exit_below_ema_fast: false     # close below EMA20 after breakeven → sell
  max_hold_bars: 0               # time stop in days (0 = off)
  time_stop_min_r: 1.0           # …if the trade never reached +1R
  # Heikin-Ashi filters — smoothed candles used for signals only (orders and stops use real prices).
  ha_entry: green                # off | green (signal day's HA candle green) | strong (green, no lower wick)
  ha_exit: off                   # off | red (N red HA candles in a row) | strong_red — every HA exit cut winners short
  ha_exit_bars: 2                # N for ha_exit: red
  ha_exit_always: false          # true: HA exit also before breakeven
  ha_wick_pct: 10                # a wick up to this % of the HA candle's range counts as "no wick"

risk:
  capital: 100000                # ₹ the engine may deploy (paper: starting cash)
  risk_per_trade_pct: 1.0        # ₹ lost if the initial stop is hit = 1% of equity
  max_position_pct: 20           # at most 20% of equity in one stock
  max_positions: 5
  max_new_per_day: 2
  drawdown_pause_pct: 15         # equity 15% below its peak pauses new entries…
  drawdown_pause_days: 20        # …for 20 trading days; then the peak resets to current equity and trading resumes

costs:                           # Zerodha equity delivery (zerodha.com/charges)
  brokerage_pct: 0
  stt_pct: 0.1                   # on buy and sell
  stamp_buy_pct: 0.015
  exchange_pct: 0.00307          # NSE
  sebi_per_crore: 10
  gst_pct: 18                    # on brokerage + exchange + SEBI charges
  dp_per_sell: 15.34             # per stock, on each day you sell
  slippage_pct: 0.10             # assumed per side (backtest and paper fills)

mtf:                             # Margin Trading Facility — BACKTEST ONLY for now (the engine refuses to start with it on)
  enabled: false
  leverage: 2                    # 2 = you pay 50%, Zerodha lends 50% (Zerodha allows up to 4–5× by stock)
  borrow_only_shortfall: true    # pay with cash first; borrow only when cash is short
  interest_pct_per_day: 0.04     # ₹40 per lakh borrowed per calendar day, from T+1 (≈14.6% a year)
  brokerage_pct: 0.3             # MTF brokerage: 0.3% per order…
  brokerage_max: 20              # …capped at ₹20 (+GST); CNC delivery is free
  pledge_fee: 15                 # ₹15 + GST per stock per buy day (auto-pledge)
  unpledge_fee: 15               # ₹15 + GST per stock when sold

orders:
  max_ops: 8                     # SEBI registration threshold is 10 orders/second
  max_per_minute: 200
  max_per_day: 2000
  emergency_reserve: 100
  workers: 4
  retry_backoff: 200ms
  emergency_retries: 3
  market_protection: -1          # MARKET orders must carry protection; -1 = Kite auto
  entry_limit_buffer_pct: 0.5    # entry = LIMIT 0.5% above the ask (never chases further)
  gtt_limit_buffer_pct: 1.0      # stop GTT sells with a LIMIT 1% below the trigger
  fill_timeout: 20s
  entry_max_age: 2m

market:
  index: "NIFTY 50"
  regime_filter: true            # new entries only while NIFTY 50 closes above its 50 EMA

backtest:
  years: 5
  capital: 500000                # ₹ starting capital for backtests (0 = risk.capital)
  auto_universe:                 # pick the stocks to scan by rule (no hindsight) instead of universe.csv
    enabled: false
    source: all_nse              # all_nse: every NSE share (first download ≈ 25 min) · file: a broad list such as the NIFTY 500 CSV
    file: nifty500.csv
    top_n: 50                    # each month, scan the 50 strongest stocks…
    lookback_days: 120           # …by return over the last 120 sessions, among those passing min_price and min_turnover_cr then

# "Hold N stocks" portfolio mode — BACKTEST ONLY for now (the paper/live engine
# ignores it). The Backtest tab in the control panel overrides these values.
holdings:
  enabled: false
  slots: 5                       # stocks held at once; capital split equally, empty slots refilled every morning
  market_check: off              # off (no index gate) | nifty (NIFTY 50 for every stock) | category (the stock's own index, from caps_file)
  market_ha_green: true          # the index's Heikin-Ashi candle must also be green
  midcap_index: "NIFTY MIDCAP 150"
  smallcap_index: "NIFTY SMLCAP 250"
  caps_file: caps.csv            # SYMBOL,large|mid|small per line; unlisted stocks count as large

server:
  listen: "127.0.0.1:8080"
  public_url: "http://127.0.0.1:8080"

# NSE trading holidays (YYYY-MM-DD). Weekends are skipped automatically.
holidays: []
